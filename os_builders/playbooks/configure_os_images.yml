---
- name: Check if we have any hosts in the inventory
  hosts: localhost
  tasks:
    - fail:
        msg: "[ERROR] Empty inventory. No host available."
      when: groups.all|length == 0

- name:
  hosts: all
  gather_facts: false  # This is required if we potentially don't have Python available on the target
  pre_tasks:
    - name: User warning
      ansible.builtin.debug:
        msg: "[Warning] Do not run on non-cloud machine"
  roles:
    - role: ensure_python

- name: Prepare the image with the STFC security baseline
  hosts: all
  pre_tasks:
    - name: Check if we are in a container from the GitHub workflows
      become: true
      ansible.builtin.command: "cat /proc/self/cgroup"
      register: in_container_check

    - name: Set_fact for checking container for subsequent steps
      ansible.builtin.set_fact:
        in_container: "{{ in_container_check.stdout == '0::/' }}"
  roles:
    - role: image_create
    - role: vm_baseline
    - role: container_registry
    - role: nubes_boot
    - role: image_fixes
    - role: tidy_image
