- name: Install cron on Ubuntu
  apt:
    name: "cron"
    state: present
    update_cache: yes
  when: ansible_facts['distribution'] == "Ubuntu"
  become: true

- name: Install cron on RL
  yum:
    name: "cronie"
    state: present
    enablerepo: >-
      {{
         ['rocky-upstream-baseos', 'rocky-upstream-appstream'] if
         not dnf_baseos_enabled or not dnf_appstream_enabled
         else omit
      }}
  when: ansible_facts['distribution'] == "Rocky"
  become: true
