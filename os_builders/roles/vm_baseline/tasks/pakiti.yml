- name: Ensure perl is installed (Ubuntu)
  ansible.builtin.apt:
    name: perl
    state: present
  when: ansible_facts['distribution'] == "Ubuntu"
  become: true

- name: Ensure perl is installed (RedHat)
  ansible.builtin.dnf:
    name: perl
    state: present
    enablerepo: >-
      {{
         ['rocky-upstream-baseos', 'rocky-upstream-appstream'] if
         not dnf_baseos_enabled or not dnf_appstream_enabled
         else omit
      }}
  when: ansible_facts['distribution'] == "Rocky"
  become: true

- name: Copy Pakiti client script
  become: true
  ansible.builtin.copy:
    src: pakiti3
    dest: /usr/sbin/pakiti3
    mode: '0554'
    owner: 'root'
    group: 'root'

- name: Copy the run script to cron.daily
  become: true
  ansible.builtin.copy:
    src: run-pakiti
    dest: /etc/cron.daily/run-pakiti
    mode: '0554'
    owner: 'root'
    group: 'root'
