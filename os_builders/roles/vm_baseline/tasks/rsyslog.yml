- name: Ensure rsyslog is installed (Ubuntu)
  ansible.builtin.apt:
    name: rsyslog
    state: present
  when: ansible_facts['distribution'] == "Ubuntu"
  become: true

- name: Ensure rsyslog is installed (RedHat)
  ansible.builtin.dnf:
    name: rsyslog
    state: present
    enablerepo: >-
      {{
         ['rocky-upstream-baseos', 'rocky-upstream-appstream'] if
         not dnf_baseos_enabled or not dnf_appstream_enabled
         else omit
      }}
  when: ansible_facts['distribution'] == "Rocky"
  become: true

- name: Copy rsyslog.conf
  copy:
    src: "etc/rsyslog.conf"
    dest: "/etc/rsyslog.conf"
    owner: root
    group: root
    mode: 0644
  become: true

- name: Copy rsyslog.d
  copy:
    src: "rsyslog.d"
    dest: "/etc/rsyslog.d"
    owner: root
    group: root
    mode: 0755
  become: true

- name: Ensure autditd is installed
  package:
    name: auditd
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Ensure auditd is installed
  package:
    name:
      - audit
      - audispd-plugins
    state: present
  become: true
  when: ansible_os_family == "RedHat"

- name: Ensure auditd service is started and enabled
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
  when: not in_container

- name: Deploy Wazuh specific auditd rules
  ansible.builtin.template:
    src: wazuh_auditd.j2
    dest: /etc/audit/rules.d/wazuh.rules
    owner: root
    group: root
    mode: '0600'
  notify: Reload auditd rules
