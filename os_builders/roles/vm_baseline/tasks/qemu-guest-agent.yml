- name: Install Qemu Guest Agent on Ubuntu
  apt:
    name: qemu-guest-agent
    state: present
    update_cache: yes
  when: ansible_facts['distribution'] == "Ubuntu"
  become: true

- name: Install Qemu Guest Agent on RL
  yum:
    name: "qemu-guest-agent"
    state: present
    enablerepo: >-
      {{
         ['rocky-upstream-baseos', 'rocky-upstream-appstream'] if
         not dnf_baseos_enabled or not dnf_appstream_enabled
         else omit
      }}
  when: ansible_facts['distribution'] == "Rocky"
  become: true

- name: Enable Qemu Guest Agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent.service
    enabled: true
  become: true
  when: not vm_baseline_in_container
