- name: add wazuh repo
  yum_repository:
    name: wazuh
    file: wazuh
    description: "Repository to install wazuh"
    baseurl: https://packages.wazuh.com/4.x/yum/
    enabled: true
    gpgcheck: true
    gpgkey: https://packages.wazuh.com/key/GPG-KEY-WAZUH
  become: true

- name: Install wazuh
  yum:
    name:
      - wazuh-agent-4.14.*
    state: present
    enablerepo: >-
      {{
         ['rocky-upstream-baseos', 'rocky-upstream-appstream'] if
         not dnf_baseos_enabled or not dnf_appstream_enabled
         else omit
      }}
  become: true
