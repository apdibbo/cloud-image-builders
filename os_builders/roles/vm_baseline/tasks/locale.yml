---
- name: Install locales on Debian
  ansible.builtin.apt:
    name: locales
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family']  == "Debian"

- name: Install locales on RedHat
  ansible.builtin.dnf:
    name:
      - glibc-locale-source
      - glibc-langpack-en
    state: present
    enablerepo: >-
      {{
         ['rocky-upstream-baseos', 'rocky-upstream-appstream'] if
         not dnf_baseos_enabled or not dnf_appstream_enabled
         else omit
      }}
  become: true
  when: ansible_facts['os_family']  == "RedHat"
